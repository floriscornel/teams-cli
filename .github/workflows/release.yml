# release.yml -- cut a release from a signed tag (PLAN.md "Release process").
#
# A maintainer runs `git tag -s vX.Y.Z && git push --tags`; this workflow does
# the rest: GoReleaser builds the matrix, creates the GitHub Release, publishes
# the Homebrew cask and the Scoop manifest, signs the checksum file with cosign
# keyless and attests the build provenance.
#
# v0.x: this workflow does NOT publish to package managers.
#   Tags carry a prerelease indicator (`v0.2.0-rc.1`) during v0.x, so
#   `release.prerelease: auto` plus `skip_upload: auto` on the cask and the
#   Scoop manifest keep the tap and the bucket untouched (PLAN.md "Release
#   process"). Cutting a plain `v0.x.y` tag would publish them -- don't.
#   winget stays commented out in .goreleaser.yaml until v1.0.
#
# Local equivalent: `make snapshot` (build only) and `make release-check`
# (config validation). There is no `make release` target, so the GoReleaser
# invocation below is direct; see docs/ci.md.

name: release

on:
  push:
    tags:
      - "v*"

# Least privilege for what this workflow actually does:
permissions:
  contents: write # create the GitHub Release; push the cask/Scoop commits
  id-token: write # cosign keyless signing (GitHub OIDC) + provenance attestation
  attestations: write # actions/attest-build-provenance

# Never cancel a release half-way: a cancelled run can leave a partial release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION_FILE: go.mod
  # Bumped by Renovate through the `# renovate:` comment above each value
  # (renovate.json -> customManagers). Keep these equal to the versions the
  # configuration was validated against locally: GoReleaser v2.18.2 validated
  # .goreleaser.yaml, syft v1.54.0 generated the SBOMs, cosign v3.1.3 signs the
  # checksums.
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.18.2
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: v1.54.0

jobs:
  release:
    name: goreleaser release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history to build the changelog and to
          # resolve the previous tag (refs/goreleaser/www/content/customization/
          # ci/actions.md: "Fetch all history").
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      # The GoReleaser Action installs and configures nothing else, so the
      # tools used by `sboms:` (syft) and `signs:` (cosign) are installed here
      # explicitly -- see refs/goreleaser/www/content/customization/ci/
      # actions.md, "The action does not install, configure or authenticate
      # into dependencies".
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # Cross-repo pushes (floriscornel/homebrew-tap, floriscornel/scoop-bucket)
      # use a GitHub App installation token, never a PAT (PLAN.md "Release
      # secrets"). The App needs `contents: write` and must be installed on the
      # three repositories listed below.
      - name: Create a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            teams-cli
            homebrew-tap
            scoop-bucket
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          # The App token, not the default GITHUB_TOKEN: it is the only token
          # that can also commit to the tap and the bucket. The GoReleaser
          # publishers default to this token.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Keyless cosign signing uses the runner's OIDC token
          # (`permissions.id-token: write` above); nothing else is needed.

      # Build provenance for every artifact listed in the checksum file, so a
      # user can run `gh attestation verify --owner floriscornel <artifact>`
      # (refs/goreleaser/www/content/customization/publish/attestations.md).
      # That doc now shows `actions/attest`; this workflow uses
      # `actions/attest-build-provenance`, which is the same attestation with a
      # SLSA build-provenance predicate and the action PLAN.md names.
      - name: Attest the checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Upload the SBOMs
        # The SBOMs are already attached to the GitHub Release by GoReleaser;
        # keeping a copy as a workflow artifact makes them downloadable from the
        # Actions UI too.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: |
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 90
