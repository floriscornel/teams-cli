# release.yml -- cut a release from a signed tag (PLAN.md "Release process").
#
# A maintainer runs `git tag -s vX.Y.Z && git push --tags`; this workflow does
# the rest: GoReleaser builds the darwin/linux/windows matrix, creates the
# GitHub Release with the archives, the checksum file, one SBOM per archive and
# a cosign keyless signature over the checksums, then attests the build
# provenance.
#
# **GitHub Releases is the only install channel.** Nothing is pushed to another
# repository: no Homebrew cask, no Scoop bucket, no winget PR and no deb/rpm/apk
# packages. That is why this workflow needs no GitHub App installation token and
# no RELEASE_APP_* secrets -- the automatic GITHUB_TOKEN writes the release in
# this repository and nothing else (PLAN.md "Install channels").
#
# Tool versions come from mise.toml (Go, GoReleaser, cosign, syft); the only
# version pinned in this file is the mise binary itself.
#
# Local equivalents: `mise run release-check` (config validation) and
# `mise run snapshot` (the build matrix, no publish).

name: release

on:
  push:
    tags:
      - "v*"

# Least privilege for what this workflow actually does:
permissions:
  contents: write # create the GitHub Release in this repository
  id-token: write # cosign keyless signing (GitHub OIDC) + provenance attestation
  attestations: write # actions/attest-build-provenance

# Never cancel a release half-way: a cancelled run can leave a partial release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: "2026.9.18"

jobs:
  release:
    name: goreleaser release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history to build the changelog and to
          # resolve the previous tag (refs/goreleaser/www/content/customization/
          # ci/actions.md: "Fetch all history").
          fetch-depth: 0

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}
          # GoReleaser, cosign and syft are pinned on the `release` task in
          # mise.toml rather than in [tools], so they are installed when the task
          # runs; saving the cache in the action's post step caches them too.
          cache_save_post: true

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # `mise run release` installs the pinned GoReleaser, cosign and syft on
      # demand (mise.toml task tools) and runs `goreleaser release --clean`.
      # goreleaser invokes cosign for `signs:` and syft for `sboms:`, which is
      # why all three live in one place instead of in three pinned actions.
      # Keyless cosign signing uses the runner's OIDC token
      # (`permissions.id-token: write` above); nothing else is needed.
      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release

      # Build provenance for every artifact listed in the checksum file, so a
      # user can run `gh attestation verify --owner floriscornel <artifact>`
      # (refs/goreleaser/www/content/customization/publish/attestations.md).
      # That doc now shows `actions/attest`; this workflow uses
      # `actions/attest-build-provenance`, which is the same attestation with a
      # SLSA build-provenance predicate and the action PLAN.md names.
      - name: Attest the checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Upload the SBOMs
        # The SBOMs are already attached to the GitHub Release by GoReleaser;
        # keeping a copy as a workflow artifact makes them downloadable from the
        # Actions UI too.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: |
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 90
