# ci.yml -- every PR and every push to main (PLAN.md "Workflows" table).
#
# Conventions that apply to this whole file:
#   * `permissions: contents: read` by default; jobs that need more say so.
#   * Every third-party action is pinned by full commit SHA, with the release
#     tag in a trailing comment so Renovate can bump it (renovate.json).
#   * Every step runs a mise task, because mise.toml is the single entry point
#     for humans and CI (PLAN.md "Toolchain and local workflow"). The only
#     exceptions are documented inline.
#   * `concurrency` cancels superseded PR runs.
#
# Tool versions (Go, golangci-lint, GoReleaser, cosign, syft, govulncheck) live
# in mise.toml and are installed by jdx/mise-action, so CI and a local `mise
# install` use the same binaries. Only the mise *binary* version is pinned here.
#
# This workflow is also a reusable workflow (`on.workflow_call`): nightly.yml
# calls it with `refs-check-only: true` so the refs-check job has exactly one
# definition (PLAN.md "Workflows" table: "refs-check (job, reused)").

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      refs-check-only:
        description: >-
          Run only the reference-mirror jobs. Used by nightly.yml to reuse the
          refs-check job without re-running the whole PR pipeline.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # mise.toml is the source of truth for tool versions; this is the mise
  # *binary*. Pinned rather than letting the action pick "newest release at
  # least 24h old", so a mise release cannot change CI behaviour on its own.
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: "2026.9.18"

jobs:
  # ---------------------------------------------------------------------------
  # lint: formatting, golangci-lint, go mod tidy diff check, goreleaser check
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    if: ${{ inputs['refs-check-only'] != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}
          # mise.toml pins GoReleaser (and cosign/syft) on the task that uses
          # it, so it is not installed by `mise install`. Saving the cache in
          # the action's post step puts those on-demand tools in the cache too,
          # which stops this job from re-downloading GoReleaser on every run.
          cache_save_post: true

      # mise.toml keeps the Go caches inside the checkout (.cache/), so they are
      # cached explicitly here; actions/setup-go would cache the global paths
      # instead, which no task uses.
      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # `mise run fmt-check` and `mise run lint` are exactly what a developer
      # runs; `mise run lint` validates .golangci.yml first, so a v2 schema
      # error fails here rather than inside the linter.
      - name: Check formatting (gofumpt + goimports)
        run: mise run fmt-check

      - name: Lint
        run: mise run lint

      - name: Check go.mod/go.sum are tidy
        run: mise run tidy

      # Installs goreleaser on demand (mise.toml pins it on the task).
      - name: Validate .goreleaser.yaml
        run: mise run release-check

  # ---------------------------------------------------------------------------
  # test: ubuntu / macos / windows, race detector, shuffled, testscript
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    if: ${{ inputs['refs-check-only'] != true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Report every platform, not just the first failure.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # `mise run test` is `go test -race -shuffle=on ./...` (mise.toml). Layer 5
      # testscript tests are ordinary Go tests driven by testscript.Main, so the
      # same command runs them everywhere -- including Windows, where the task is
      # a plain command with no shell syntax (mise uses `cmd /c` there). The
      # Makefile could not do this: the Windows runner image ships no `make`, so
      # this job used to run `go test` by hand.
      - name: Run the test suite (layers 1-5, includes testscript)
        run: mise run test

  # ---------------------------------------------------------------------------
  # coverage: 80% floor, Codecov (PLAN.md "CI gates")
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    if: ${{ inputs['refs-check-only'] != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # `mise run cover` runs the whole suite ONCE with -covermode=atomic into a
      # single merged coverage.out and then enforces the floor through
      # internal/testing/coveragecheck. The exclusion list lives in mise.toml and
      # is the reviewed coverage scope (PLAN.md "Coverage scope").
      - name: Enforce the coverage floor (>= 80%)
        run: mise run cover

      - name: Upload coverage to Codecov
        # Runs even when the gate above failed, so a red build still has data
        # (same intent as refs/teams-mcp/.github/workflows/ci.yml).
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
          verbose: true

  # ---------------------------------------------------------------------------
  # vuln: govulncheck
  # ---------------------------------------------------------------------------
  vuln:
    name: vuln
    if: ${{ inputs['refs-check-only'] != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}
          # govulncheck is `go install`ed on demand by the vuln task; caching it
          # in the action's post step keeps that off every run.
          cache_save_post: true

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # govulncheck is pinned in mise.toml (the old target ran
      # `go run golang.org/x/vuln/cmd/govulncheck@latest`, so the scanner could
      # drift between runs).
      - name: Run govulncheck
        run: mise run vuln

  # ---------------------------------------------------------------------------
  # build: the full cross-compile matrix, uploaded for the smoke job
  # ---------------------------------------------------------------------------
  build:
    name: build (snapshot)
    if: ${{ inputs['refs-check-only'] != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # fetch-depth: 0 is required by GoReleaser (it needs the tag/history).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}
          # See the lint job: this job's task installs GoReleaser on demand.
          cache_save_post: true

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Cross-compile the release matrix
        run: mise run snapshot

      - name: Upload dist/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # The dist/ tree is ~30 MB of binaries; a week is enough for the
          # smoke job and for debugging a failed PR.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # smoke: install the snapshot on a runner with no Go and no Node
  # (PLAN.md "CI gates" -> Release smoke)
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (${{ matrix.os }})
    if: ${{ inputs['refs-check-only'] != true }}
    needs:
      - build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      # Deliberately no mise and no actions/setup-go in this job: mise would
      # install the Go toolchain from mise.toml, and the point of this job is
      # that a released artifact runs on a machine with no Go and no Node
      # runtime behind it. The steps are shell scripts, not tasks, for the same
      # reason (this is the documented exception to "every step runs a task").
      - name: Download the snapshot artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install the snapshot binary
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)   os=linux;   arch=amd64; exe=teams ;;
            macOS)   os=darwin;  arch=arm64; exe=teams ;;
            Windows) os=windows; arch=amd64; exe=teams.exe ;;
            *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          # `mise run snapshot` lays the matrix out as dist/<build>_<os>_<arch>[_<variant>]/teams
          src=$(find dist -type f -path "dist/teams_${os}_${arch}*/${exe}" | head -n 1)
          test -n "$src"
          echo "installing $src"
          bin_dir="$RUNNER_TEMP/teams-bin"
          mkdir -p "$bin_dir"
          cp "$src" "$bin_dir/"
          chmod +x "$bin_dir"/*"$exe"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: teams version
        shell: bash
        # TEAMS_NO_UPDATE_CHECK also keeps the smoke test off the network
        # (PLAN.md "Other dev experience" -> Update check).
        env:
          TEAMS_NO_UPDATE_CHECK: "1"
        run: teams version

      - name: teams auth status must exit 3 (auth required)
        shell: bash
        env:
          TEAMS_NO_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          set +e
          teams auth status
          code=$?
          set -e
          echo "'teams auth status' exited $code"
          if [ "$code" -ne 3 ]; then
            echo "::error::expected 'teams auth status' to exit 3 (auth required), got $code"
            exit 1
          fi

      - name: Assert the released binary has no test-only endpoints
        shell: bash
        env:
          TEAMS_NO_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          # PLAN.md "CI gates" -> Release smoke: the `-tags dev` build is the
          # only place an endpoint override exists, and it must never ship.
          # Update this list in the same PR that introduces such a flag.
          banned="endpoint-override fakegraph-base-url fakeidp-base-url TEAMS_TEST_GRAPH_URL TEAMS_TEST_AUTHORITY"
          binary=$(command -v teams)
          echo "inspecting $binary"
          for token in $banned; do
            if grep -a -q -e "$token" "$binary"; then
              echo "::error::released binary contains the test-only marker '$token'"
              exit 1
            fi
            if teams --help 2>&1 | grep -q -e "$token"; then
              echo "::error::released binary exposes the test-only flag '$token'"
              exit 1
            fi
          done

      # The local half of this job is `mise run smoke` (scripts/smoke.sh),
      # which runs a built binary through the same contract plus the cache
      # round trip; keep the marker list in the two in step.

  # ---------------------------------------------------------------------------
  # docs: regenerate docs/commands + man pages, fail on diff
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    if: ${{ inputs['refs-check-only'] != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Check the generated docs are up to date
        run: mise run docs-check

  # ---------------------------------------------------------------------------
  # refs-check: the vendored reference mirror (PLAN.md "Workflows" table)
  # ---------------------------------------------------------------------------
  refs-changed:
    name: refs-changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      refs: ${{ steps.detect.outputs.refs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes to the mirror or its generated inputs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Reused from nightly.yml: the nightly must always recheck the mirror.
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            echo "refs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request) range="${BASE_SHA}...${HEAD_SHA}" ;;
            push)
              if printf '%s' "$BEFORE_SHA" | grep -qE '^0+$'; then
                range="HEAD^...HEAD"
              else
                range="${BEFORE_SHA}...${HEAD_SHA}"
              fi
              ;;
            *) range="HEAD^...HEAD" ;;
          esac
          # Paths whose change can invalidate the committed mirror artifacts.
          # The Layer 6 inputs (the trimmed OpenAPI subset, the route list and
          # the provenance record) are generated from refs/ and committed under
          # internal/testing/testdata/openapi/, so that directory counts as an
          # input here (PLAN.md Layer 6).
          changed=$(git diff --name-only "$range" || true)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(scripts/fetch-refs\.sh|scripts/gen-contract\.sh|refs/INDEX\.md|refs/MANIFEST\.md|internal/testing/contract/|internal/testing/testdata/openapi/)'; then
            echo "refs=true" >> "$GITHUB_OUTPUT"
          else
            echo "refs=false" >> "$GITHUB_OUTPUT"
          fi

  refs-check:
    name: refs-check
    needs:
      - refs-changed
    if: needs.refs-changed.outputs.refs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # The mirror is pinned by refs/MANIFEST.md, so its hash is the cache key
      # (PLAN.md "Workflows" table: "cached by the hash of refs/MANIFEST.md").
      # No restore-keys on purpose: a stale mirror restored over the checked-out
      # refs/INDEX.md or refs/MANIFEST.md would silently verify the wrong SHAs.
      # A miss just means a fresh fetch.
      - name: Cache the reference mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: refs
          key: refs-${{ hashFiles('refs/MANIFEST.md') }}

      # scripts/fetch-refs.sh is idempotent and keeps every source on the SHA in
      # refs/MANIFEST.md; a cache hit makes it a no-op.
      - name: Fetch the mirror at the pinned SHAs
        run: mise run refs-fetch

      - name: Verify the mirror
        run: mise run refs-check

      - name: Regenerate the Layer 6 contract inputs
        run: mise run contract-generate

      - name: Fail when the regenerated inputs differ from the committed ones
        run: |
          set -euo pipefail
          # refs/ is gitignored apart from INDEX.md and MANIFEST.md, so `git add`
          # only sees the committed generated artifacts, never the mirror.
          git add -A
          if ! git diff --cached --exit-code; then
            echo "::error::the mirror or the generated Layer 6 inputs are stale."
            echo "::error::run 'mise run refs-fetch && mise run contract-generate' and commit the result."
            git --no-pager diff --cached --stat
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # pr-title: Conventional Commits, enforced because GoReleaser's changelog
  # groups on those prefixes (PLAN.md "Cutting a release")
  # ---------------------------------------------------------------------------
  pr-title:
    name: pr-title
    # Only meaningful for pull_request; skipped for pushes and for the
    # workflow_call from nightly.yml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # A small script rather than another pinned third-party action: the
          # rule is one regex, and release notes depend on it.
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(auth): add device code flow'"
            echo "::error::got: $TITLE"
            exit 1
          fi
          echo "ok: $TITLE"
