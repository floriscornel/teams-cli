# nightly.yml -- the scheduled jobs that are too slow (or too noisy) for a PR
# (PLAN.md "Workflows" table, row nightly.yml).
#
# Three things run here:
#   1. fuzz      -- `mise run fuzz-short` with a much longer -fuzztime budget
#                   (PLAN.md "CI gates": "a short -fuzztime nightly");
#   2. spec-drift-- re-runs Layer 6 against the SAME pinned spec SHA. This is
#                   deliberately not "download the latest spec": the point is to
#                   detect drift in our own toolchain and dependencies
#                   (PLAN.md Layer 6, "Drift check");
#   3. refs-check-- reuses the job from ci.yml via `workflow_call`, so the
#                   mirror is verified on a schedule and not only on PRs.
#
# Every step runs a mise task, like ci.yml (mise.toml is the single entry point;
# tool versions live there and jdx/mise-action installs them).

name: nightly

on:
  schedule:
    # 04:17 UTC: off the hour, so we are not queued behind the :00 stampede.
    - cron: "17 4 * * *"
  # So a maintainer can reproduce a red nightly without waiting 24h.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  # A new nightly supersedes the previous one.
  cancel-in-progress: true

env:
  # keep in step with ci.yml (and mise.toml for the tool versions themselves)
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: "2026.9.18"

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # 15s x targets locally; 10m each here (mise.toml reads FUZZTIME).
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # `mise run fuzz-short` walks every Fuzz* target in cmd/ and internal/ and
      # runs it with `-fuzztime ${FUZZTIME}`. With no fuzz targets yet this is a
      # clean no-op.
      - name: Fuzz every target for 10 minutes
        env:
          FUZZTIME: 10m
          # Longer runs may find input that crashes a worker; keep the whole
          # corpus so the next run starts warm.
          GOFLAGS: -timeout=30m
        run: mise run fuzz-short

  spec-drift:
    name: spec-drift (Layer 6, pinned spec)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PLAN.md Layer 6 says the drift check "opens an issue when a rerun
    # disagrees"; that needs issue write access.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install mise (and the pinned tools from mise.toml)
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Cache the Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gopath/pkg/mod
            .cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Note what this job does NOT do: it never fetches refs/ and never
      # resolves a branch tip. The trimmed OpenAPI description and the
      # api-reference route list are committed inputs, pinned by the SHA in
      # refs/MANIFEST.md, and `scripts/fetch-refs.sh --update` is the only
      # supported way to move them (reviewed like any other dependency).
      #
      # `mise run contract` runs the Layer 6 package without the race detector,
      # which is where the drift shows up: it is a subset of the normal suite,
      # so this job is cheap and its failures are precise. (The refs/-dependent
      # generator tests skip here -- they need the mirror, and refs-check is the
      # job that has it.)
      #
      # PLAN.md calls this "weekly"; running it nightly is a superset.
      - name: Re-run the contract tests against the pinned spec
        run: mise run contract

      - name: Record the pinned mirror SHAs for the failure report
        if: failure()
        run: |
          set -euo pipefail
          echo "=== refs/MANIFEST.md (pinned SHAs) ==="
          cat refs/MANIFEST.md || true

      - name: File a drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Same pinned inputs, different verdict => our toolchain or a
          # dependency moved, not Microsoft.
          title="spec drift: Layer 6 contract tests fail against the pinned spec"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "an open drift issue already exists; not filing another"
            exit 0
          fi
          body=$(printf '%s\n' \
            "The nightly Layer 6 run failed against the **same pinned spec SHA**." \
            "" \
            "That means a tool or dependency moved, not the Graph description: the" \
            "trimmed OpenAPI subset and the route list are committed and pinned by" \
            "\`refs/MANIFEST.md\`, and this job never downloads a newer spec." \
            "" \
            "- Run: $RUN_URL" \
            "- Commit: ${{ github.sha }}" \
            "- Reproduce: \`mise run contract\`" \
            "" \
            "Usual suspects: \`kin-openapi\` (validator changes), the Go toolchain, or" \
            "the golden files produced by \`mise run contract-generate\`.")
          gh issue create --title "$title" --body "$body"

  refs-check:
    name: refs-check
    # Reuse the definition from ci.yml: ci.yml is a reusable workflow
    # (`on.workflow_call`) and this input selects just the mirror jobs.
    uses: ./.github/workflows/ci.yml
    with:
      refs-check-only: true
    permissions:
      contents: read
