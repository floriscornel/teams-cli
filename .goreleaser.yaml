# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# GoReleaser OSS configuration for the `teams` CLI (PLAN.md "CI/CD, releasing
# and dev experience"). Everything here is OSS-only; every Pro-only feature is
# called out in a comment below so nobody designs around it by accident.
#
# Docs are mirrored under refs/goreleaser/www/content/ and cited per key.
#
# Install channels: GitHub Releases only. Users download an archive, or build
# from source with `go install github.com/floriscornel/teams-cli/cmd/teams@…`.
# There is no Homebrew cask, no Scoop manifest, no winget manifest and no
# deb/rpm/apk: those all push to a second repository or need a maintainer
# review, and none of them is worth it before v1.0 (PLAN.md "Install channels").
#
# Local entry points (mise.toml is the single entry point):
#   mise run release-check   -> goreleaser check
#   mise run snapshot        -> goreleaser build --snapshot --clean
#   mise run release         -> goreleaser release --clean (release.yml calls
#                               this; goreleaser invokes the pinned cosign and
#                               syft from mise.toml)
# CI:
#   .github/workflows/ci.yml  lint job -> mise run release-check
#   .github/workflows/ci.yml  build job -> mise run snapshot
#   .github/workflows/release.yml      -> mise run release
#
# Version: GoReleaser v2.18.x (config version 2).

version: 2

project_name: teams

# ---------------------------------------------------------------------------
# Builds
# refs/goreleaser/www/content/customization/builds/builders/go.md
# ---------------------------------------------------------------------------
builds:
  - id: teams
    main: ./cmd/teams
    # Binary name is `teams` inside every archive.
    binary: teams
    env:
      # darwin/linux/windows x amd64/arm64 with no cgo: the CLI is pure Go.
      - CGO_ENABLED=0
    flags:
      # -trimpath + mod_timestamp below make the builds reproducible
      # (refs/.../builders/go.md "Reproducibility").
      - -trimpath
    ldflags:
      # The variables live in internal/cli, not in cmd/teams (a bare wrapper that
      # only calls cli.Main): `-X main.version` would silently do nothing. Same
      # names and values as `mise run build`/`install`. `cli.Date` uses CommitDate
      # (not the build time) so a rebuild of the same commit is byte-identical.
      - -X github.com/floriscornel/teams-cli/internal/cli.Version={{ .Version }}
      - -X github.com/floriscornel/teams-cli/internal/cli.Commit={{ .Commit }}
      - -X github.com/floriscornel/teams-cli/internal/cli.Date={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

# ---------------------------------------------------------------------------
# Archives
# refs/goreleaser/www/content/customization/package/archives.md
# ---------------------------------------------------------------------------
archives:
  - id: default
    ids:
      - teams
    # tar.gz everywhere; zip for Windows only (format_overrides below).
    formats:
      - tar.gz
    # Explicit rather than relying on the documented default:
    #   {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Glob set replaces the documented default
    # (license*/LICENSE*/readme*/README*/changelog*/CHANGELOG*). Any glob that
    # does not match a file is fine, so this is safe before those files land
    # (refs/.../package/archives.md, "Deep diving into the globbing options").
    files:
      - LICENSE*
      - README*
      # No CHANGELOG file: the changelog is the release body, generated by
      # `changelog.use: github` below.
      # The generated man pages travel with every archive, so a user who
      # unpacks a tarball by hand still gets `man teams`; `mise run docs`
      # produces them under docs/man/ (goreleaser's `info`/`dst` per-entry
      # form). The deb/rpm/apk packages that used to consume them are gone.
      - src: docs/man/*
        dst: man
      # The shell completion scripts are generated from the same command tree
      # (`teams completion bash` prints the same bytes), so an archive install is
      # complete without running the CLI once.
      - src: docs/completion/*
        dst: completions

# ---------------------------------------------------------------------------
# Checksums
# refs/goreleaser/www/content/customization/package/checksum.md
# ---------------------------------------------------------------------------
checksum:
  # One fixed name across every artifact: release.yml signs and attests exactly
  # this file (refs/.../package/checksum.md and .../publish/attestations.md).
  name_template: checksums.txt
  algorithm: sha256

# ---------------------------------------------------------------------------
# SBOMs (syft)
# refs/goreleaser/www/content/customization/sbom.md
# ---------------------------------------------------------------------------
sboms:
  - id: archives
    # One SBOM per archive; the default document name is
    # `{{ .ArtifactName }}.sbom.json` and the default command is `syft`.
    artifacts: archive

# ---------------------------------------------------------------------------
# Signing (cosign keyless)
# refs/goreleaser/www/content/customization/sign/sign.md ("Signing with cosign")
# and refs/goreleaser/www/content/blog/cosign-v3.md (the `--bundle` shape: one
# `${artifact}.sigstore.json` instead of separate certificate + signature).
#
# Keyless needs GitHub OIDC, so release.yml sets `permissions.id-token: write`.
# No COSIGN_EXPERIMENTAL is needed with cosign v3 (the old
# blog/supply-chain-security.md note predates v2).
# ---------------------------------------------------------------------------
signs:
  - id: cosign
    cmd: cosign
    # `${artifact}` is dist/checksums.txt, so this writes
    # dist/checksums.txt.sigstore.json.
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

# ---------------------------------------------------------------------------
# Changelog
# refs/goreleaser/www/content/customization/publish/changelog.md
# ---------------------------------------------------------------------------
changelog:
  # PR titles are enforced to be Conventional Commits by the pr-title job in
  # ci.yml, and releases are squash-merged, so `github` grouping works directly.
  use: github
  sort: asc
  # -1 drops the commit hash from the changelog ("Max commit hash length").
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# ---------------------------------------------------------------------------
# GitHub release
# refs/goreleaser/www/content/customization/publish/scm/_index.md
# ---------------------------------------------------------------------------
release:
  # v0.x: any tag with a prerelease indicator (v0.2.0-rc.1) becomes a GitHub
  # pre-release and a plain v0.x.y tag a full release (PLAN.md "Release
  # process"). Nothing outside this repository is published either way.
  prerelease: auto
  # Rollback is "mark the release pre-release and ship a patch tag"; never
  # re-tag, so an existing release body is kept (this is also the default).
  mode: keep-existing
  # The release body starts with how to get the binary, because GitHub Releases
  # is the only install channel; the generated changelog follows it.
  header: |
    ## Install

    Download the archive for your platform below and put `teams` on your PATH,
    or build it from source:

    ```sh
    go install github.com/floriscornel/teams-cli/cmd/teams@{{ .Tag }}
    ```

    The archives carry the man pages and shell completions; the documentation
    lives at <https://floriscornel.github.io/teams-cli/>.

    Every archive is covered by `checksums.txt`, which is signed with cosign
    keyless (`checksums.txt.sigstore.json`) and attested, so you can verify a
    download with:

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    gh attestation verify --owner floriscornel <archive> --repository floriscornel/teams-cli --signer-workflow floriscornel/teams-cli/.github/workflows/release.yml
    ```

# ---------------------------------------------------------------------------
# Snapshots (used by `mise run snapshot` and the ci.yml build job)
# refs/goreleaser/www/content/customization/publish/snapshots.md
# ---------------------------------------------------------------------------
snapshot:
  # Keep the documented default, spelled out so the ci.yml/smoke job and the
  # local run agree on the name: <version>-SNAPSHOT-<short sha>.
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

# ---------------------------------------------------------------------------
# Not Pro-only, but worth stating: nothing here uses GoReleaser Pro features.
# Known Pro-only keys that are intentionally absent: metadata.maintainers /
# metadata.license / metadata.homepage (v2.1), changelog.title + divider (v2.12),
# changelog.paths, nfpm `if:`, homebrew_casks `app:`/`alternative_names`,
# scoops `use: msi|nsis`, winget pull_request (the publisher is OSS, the Pro
# part is the manifest templating), signs `if:`, sboms `installer`/`diskimage`
# artifact kinds.
# ---------------------------------------------------------------------------
